    const goals=t.earn<2?`<span class="num">${t.earn} / ${t.goals}</span>${ticks} <span class="aon">all-or-nothing</span>`:`<span class="num">${t.earn} / ${t.goals}</span>${ticks}`;
    const ck=t.ck?`winner ckpt ${t.ck}`:"generalist";
    const s=ST[t.st]; const ours=s?`<span class="pill ${typeof s[0]==="function"?s[0](t):s[0]}">${s[1](t)}</span>`:"";
    return `<tr><td class="r num">${t.id}</td><td class="name">${t.name.replace(/_/g," ")}<small>${t.types}</small></td><td class="r num">${t.len.toLocaleString("en-US")}</td><td>${goals}</td><td class="r num">${(1/t.goals).toFixed(2)}</td><td class="ck">${ck}</td><td>${ours}</td></tr>`}).join("");
  document.getElementById("count").textContent=`Showing ${rows.length} of ${TASKS.length} tasks.`;
}
render();
</script>
