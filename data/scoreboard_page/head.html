<title>BEHAVIOR 2026 Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87,600;87,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f4f6f4; --surface:#ffffff; --ink:#15201c; --ink-2:#4f5a55; --muted:#6c7671; --line:#dde3df; --line-2:#eef1ef;
  --accent:#1f6f5c; --accent-soft:#e3f0eb;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e6eae8;
  --good:#0b7d3b; --good-bg:#e2f3e8; --warn:#8a5a00; --warn-bg:#fbf0d6; --run:#1c5cab; --run-bg:#e2edfb; --zero:#6c7671; --zero-bg:#eef1ef;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101413; --surface:#171d1b; --ink:#e6ece9; --ink-2:#b4beb9; --muted:#8f9a95; --line:#2b3431; --line-2:#1f2624;
    --accent:#62c2a5; --accent-soft:#1b2d27;
    --s1:#3987e5; --s2:#d95926; --grid:#26302c;
    --good:#6fd39a; --good-bg:#16301f; --warn:#f0c064; --warn-bg:#33290f; --run:#86b6ef; --run-bg:#172a42; --zero:#8f9a95; --zero-bg:#1f2624;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101413; --surface:#171d1b; --ink:#e6ece9; --ink-2:#b4beb9; --muted:#8f9a95; --line:#2b3431; --line-2:#1f2624;
  --accent:#62c2a5; --accent-soft:#1b2d27;
  --s1:#3987e5; --s2:#d95926; --grid:#26302c;
  --good:#6fd39a; --good-bg:#16301f; --warn:#f0c064; --warn-bg:#33290f; --run:#86b6ef; --run-bg:#172a42; --zero:#8f9a95; --zero-bg:#1f2624;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--display);font-stretch:87%;text-wrap:balance;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05;font-weight:700}
h2{font-size:22px;font-weight:700;line-height:1.2}
h3{font-size:16px;font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--ink-2)}
.small{font-size:13px;color:var(--muted)}
section{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;flex-direction:column;gap:6px}

/* header */
header{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
header .intro{display:flex;flex-direction:column;gap:12px}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fig b{font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.fig span{font-size:12.5px;color:var(--muted);line-height:1.35}
@media (max-width:760px){header{grid-template-columns:1fr}}

/* chart */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{display:grid;grid-template-columns:minmax(120px,210px) 1fr;column-gap:14px;row-gap:10px;margin-top:14px;position:relative}
.axis{grid-column:2;position:relative;height:18px;font:12px var(--mono);color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.rlabel{font-size:13.5px;line-height:1.25;align-self:center}
.rlabel small{display:block;color:var(--muted);font:12px var(--mono)}
.track{position:relative;height:30px;align-self:center;background:repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px calc(100% / 6));background-size:100% 100%}
.bar{position:absolute;top:5px;bottom:5px;left:0;display:flex;gap:2px;cursor:default}
.seg{height:100%}
.seg:first-child{border-radius:0}
.seg:last-child{border-radius:0 4px 4px 0}
.seg.full{background:var(--s1)}
.seg.part{background:var(--s2)}
.bar.pending{border:1.5px dashed var(--s1);border-left:0;border-radius:0 4px 4px 0;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--s1) 22%,transparent) 5px 7px)}
.val{position:absolute;top:50%;transform:translateY(-50%);font:500 13px var(--mono);color:var(--ink);white-space:nowrap;padding-left:8px}
.bar:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:6px;max-width:260px;z-index:10}
@media (max-width:560px){.chart{grid-template-columns:1fr}.rlabel{margin-top:6px}.axis{grid-column:1}}

/* now + learned */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li .pill{grid-row:span 2;align-self:start;margin-top:2px}
.li b{font-weight:600}
.li p{font-size:14px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);letter-spacing:.03em;padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-done{color:var(--good);background:var(--good-bg)}
.p-run{color:var(--run);background:var(--run-bg)}
.p-queue{color:var(--warn);background:var(--warn-bg)}
.p-zero{color:var(--zero);background:var(--zero-bg)}
.p-next{color:var(--accent);background:var(--accent-soft)}
.finding{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.finding p{font-size:14px;color:var(--ink-2)}

/* explorer */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{font:500 13px var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:focus-visible,.search:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .n{font-family:var(--mono);opacity:.7;margin-left:4px}
.search{flex:1 1 200px;max-width:300px;font:14px var(--body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:13.5px}
th{text-align:left;font:500 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0;border-bottom:1px solid var(--line);padding:0}
th button{all:unset;display:block;padding:11px 12px;cursor:pointer;width:100%;box-sizing:border-box}
th button[data-dir]::after{content:" ↑";color:var(--accent)}
th button[data-dir="desc"]::after{content:" ↓"}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r button{text-align:right}
td.name{font-weight:500}
td.name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.meter{display:inline-flex;gap:2px;vertical-align:middle;margin-left:8px}
.meter i{width:5px;height:10px;border-radius:1px;background:var(--s2)}
.meter i.dead{background:var(--line)}
.aon{color:var(--muted);font-size:12px}
.ck{font:12px var(--mono);color:var(--ink-2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
footer p{max-width:90ch}
@media (prefers-reduced-motion:no-preference){.bar{transition:filter .15s}.bar:hover{filter:brightness(1.08)}}
</style>
